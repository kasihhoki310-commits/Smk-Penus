<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Online - SMK Penus</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <img id="schoolLogo" src="" alt="Logo" class="school-logo" style="display:none;">
                    <h1 id="schoolName">SMK Penus Bebas</h1>
                </div>
                <div class="datetime">
                    <p id="currentDate"></p>
                    <p id="currentTime"></p>
                </div>
                <a href="admin.html" class="btn-admin">Admin</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <h2>Dashboard Absensi Guru</h2>
            
            <!-- Filter -->
            <div class="filter-section">
                <input type="text" id="searchGuru" placeholder="Cari nama guru...">
            </div>

            <!-- Grid Guru -->
            <div id="guruGrid" class="guru-grid">
                <!-- Guru cards akan di-load di sini -->
            </div>
        </main>
    </div>

    <!-- Modal Absen -->
    <div id="absenModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Absensi <span id="guruNameModal"></span></h2>
            
            <div class="modal-tabs">
                <button class="tab-button active" data-tab="masuk">Masuk</button>
                <button class="tab-button" data-tab="pulang">Pulang</button>
                <button class="tab-button" data-tab="dinas">Perjalanan Dinas</button>
                <button class="tab-button" data-tab="sakit">Sakit</button>
                <button class="tab-button" data-tab="ijin">Ijin</button>
            </div>

            <div id="masuk" class="tab-content active">
                <div class="camera-section">
                    <video id="videoCameraMasuk" width="100%" style="border-radius: 8px; margin-bottom: 10px;"></video>
                    <canvas id="canvasMasuk" style="display:none;"></canvas>
                    <button id="takeMasukBtn" class="btn-primary">Ambil Foto Masuk</button>
                    <img id="fotoMasukPreview" src="" alt="Foto Masuk" style="display:none; width:100%; margin-top:10px; border-radius:8px;">
                    <p id="lokasi-masuk" style="font-size:12px; color:#666;"></p>
                    <button id="submitMasukBtn" class="btn-success" style="display:none;">Konfirmasi Absen Masuk</button>
                </div>
            </div>

            <div id="pulang" class="tab-content">
                <div class="camera-section">
                    <video id="videoCameraPulang" width="100%" style="border-radius: 8px; margin-bottom: 10px;"></video>
                    <canvas id="canvasPulang" style="display:none;"></canvas>
                    <button id="takePulangBtn" class="btn-primary">Ambil Foto Pulang</button>
                    <img id="fotoPulangPreview" src="" alt="Foto Pulang" style="display:none; width:100%; margin-top:10px; border-radius:8px;">
                    <p id="lokasi-pulang" style="font-size:12px; color:#666;"></p>
                    <button id="submitPulangBtn" class="btn-success" style="display:none;">Konfirmasi Absen Pulang</button>
                </div>
            </div>

            <div id="dinas" class="tab-content">
                <p>Perjalanan Dinas</p>
                <input type="date" id="tglDinas">
                <textarea id="keterDinas" placeholder="Keterangan dinas..."></textarea>
                <button class="btn-success" onclick="submitStatusAbsensi('Dinas')">Konfirmasi Dinas</button>
            </div>

            <div id="sakit" class="tab-content">
                <p>Laporan Sakit</p>
                <input type="date" id="tglSakit">
                <textarea id="keterSakit" placeholder="Keterangan sakit..."></textarea>
                <button class="btn-success" onclick="submitStatusAbsensi('Sakit')">Konfirmasi Sakit</button>
            </div>

            <div id="ijin" class="tab-content">
                <p>Permohonan Ijin</p>
                <input type="date" id="tglIjin">
                <textarea id="keterIjin" placeholder="Keterangan ijin..."></textarea>
                <button class="btn-success" onclick="submitStatusAbsensi('Ijin')">Konfirmasi Ijin</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
