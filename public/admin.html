<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Sistem Absensi</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-admin">
                <h2>Admin Panel</h2>
            </div>
            <nav class="menu">
                <a href="#" class="menu-item active" data-menu="dashboard">📊 Dashboard</a>
                <a href="#" class="menu-item" data-menu="guru">👨‍🏫 Kelola Guru</a>
                <a href="#" class="menu-item" data-menu="laporan">📋 Laporan</a>
                <a href="#" class="menu-item" data-menu="konfigurasi">⚙️ Konfigurasi</a>
                <a href="index.html" class="menu-item" style="margin-top: 30px; background: #e74c3c; color: white;">🏠 Kembali</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <!-- Password Modal -->
            <div id="passwordModal" class="modal-overlay">
                <div class="modal-password">
                    <h2>Verifikasi Admin</h2>
                    <p>Masukkan password admin untuk melanjutkan:</p>
                    <input type="password" id="adminPassword" placeholder="Password..." />
                    <button onclick="verifyPassword()" class="btn-success">Verifikasi</button>
                    <p id="errorMsg" style="color: red; margin-top: 10px; display: none;"></p>
                </div>
            </div>

            <!-- Dashboard Tab -->
            <div id="dashboard" class="tab-content active">
                <h2>Dashboard</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3 id="totalGuru">0</h3>
                        <p>Total Guru</p>
                    </div>
                </div>
            </div>

            <!-- Guru Tab -->
            <div id="guru" class="tab-content">
                <div class="guru-header">
                    <h2>Kelola Guru</h2>
                    <button class="btn-primary" onclick="openTambahGuruModal()">➕ Tambah Guru Baru</button>
                </div>
                <div id="formTambahGuru" class="form-section" style="display: none;">
                    <h3>Tambah Guru Baru</h3>
                    <input type="text" id="namaGuru" placeholder="Nama Guru">
                    <input type="text" id="nipGuru" placeholder="NIP">
                    <input type="email" id="emailGuru" placeholder="Email">
                    <button class="btn-success" onclick="tambahGuru()">Tambah</button>
                    <button class="btn-danger" onclick="closeTambahGuruModal()">Batal</button>
                </div>
                <div id="daftarGuru" class="guru-list"></div>
            </div>

            <!-- Laporan Tab -->
            <div id="laporan" class="tab-content">
                <div class="laporan-header">
                    <h2>Laporan Absensi</h2>
                    <div class="filter-laporan">
                        <select id="bulanLaporan">
                            <option value="01">Januari</option>
                            <option value="02">Februari</option>
                            <option value="03">Maret</option>
                            <option value="04">April</option>
                            <option value="05">Mei</option>
                            <option value="06">Juni</option>
                            <option value="07">Juli</option>
                            <option value="08">Agustus</option>
                            <option value="09">September</option>
                            <option value="10">Oktober</option>
                            <option value="11">November</option>
                            <option value="12">Desember</option>
                        </select>
                        <input type="number" id="tahunLaporan" placeholder="Tahun" value="2026" min="2020" max="2030">
                        <button class="btn-primary" onclick="loadLaporan()">Lihat Laporan</button>
                        <button class="btn-success" onclick="printLaporan()">🖨️ Print</button>
                    </div>
                </div>
                <div id="tableLaporan"></div>
            </div>

            <!-- Konfigurasi Tab -->
            <div id="konfigurasi" class="tab-content">
                <h2>Konfigurasi Sekolah</h2>
                <div class="config-form">
                    <div class="form-group">
                        <label>Nama Sekolah</label>
                        <input type="text" id="schoolName" placeholder="Nama Sekolah">
                    </div>
                    <div class="form-group">
                        <label>Kepala Sekolah</label>
                        <input type="text" id="kepalSekolah" placeholder="Nama Kepala Sekolah">
                    </div>
                    <div class="form-group">
                        <label>WKS Kurikulum</label>
                        <input type="text" id="wksKurikulum" placeholder="Nama WKS Kurikulum">
                    </div>
                    <div class="form-group">
                        <label>Password Admin Baru</label>
                        <input type="password" id="newAdminPassword" placeholder="Password baru">
                    </div>
                    <button class="btn-success" onclick="simpanKonfigurasi()">💾 Simpan</button>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
